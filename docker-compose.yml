services:
  olcrtc:
    image: olcrtc/server:local
    container_name: olcrtc-server
    restart: always
    network_mode: host
    environment:
      - OLCRTC_MODE=srv
      - OLCRTC_CARRIER=${OLCRTC_CARRIER:-telemost}
      - OLCRTC_ROOM_ID=${OLCRTC_ROOM_ID}
      - OLCRTC_KEY=${OLCRTC_KEY}
      - OLCRTC_CLIENT_ID=${OLCRTC_CLIENT_ID:-vps-server-01}
      - OLCRTC_TRANSPORT=${OLCRTC_TRANSPORT:-vp8channel}
      - OLCRTC_VP8_FPS=${OLCRTC_VP8_FPS:-30}
      - OLCRTC_VP8_BATCH=${OLCRTC_VP8_BATCH:-2}
      - OLCRTC_LINK=${OLCRTC_LINK:-direct}
      - OLCRTC_DNS=${OLCRTC_DNS:-1.1.1.1:53}
      - OLCRTC_DATA=${OLCRTC_DATA:-/usr/share/olcrtc}
    command: >
      -mode ${OLCRTC_MODE}
      -carrier ${OLCRTC_CARRIER}
      -id ${OLCRTC_ROOM_ID}
      -key ${OLCRTC_KEY}
      -client-id ${OLCRTC_CLIENT_ID}
      -transport ${OLCRTC_TRANSPORT}
      -vp8-fps ${OLCRTC_VP8_FPS}
      -vp8-batch ${OLCRTC_VP8_BATCH}
      -link ${OLCRTC_LINK}
      -dns ${OLCRTC_DNS}
      -data ${OLCRTC_DATA}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: ./bot
    container_name: olcrtc-bot
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/config
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_CHAT_ID=${ALLOWED_CHAT_ID}
    depends_on:
      - olcrtc
